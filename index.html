<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AUTO">
  <link rel="manifest" href="manifest.json">
  <link rel="alternate" type="application/json" href="alex-module.json" title="ALEX module manifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>AUTO — Alex HUB</title>
</head>
<body>
  <a class="skip-link" href="#app">Vai al contenuto</a>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ALEX HUB · MODULE</p>
        <h1>AUTO</h1>
      </div>
      <button id="quickFuelBtn" class="primary compact">+ Rifornimento</button>
    </header>

    <main id="app" class="content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button data-view="dashboard" class="nav-btn active">Home</button>
      <button data-view="vehicles" class="nav-btn">Veicoli</button>
      <button data-view="fuel" class="nav-btn">Rifornimenti</button>
      <button data-view="maintenance" class="nav-btn">Manutenzione</button>
      <button data-view="costs" class="nav-btn">Costi</button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalFormWrap">
      <div class="modal-head">
        <h2 id="modalTitle">Nuovo</h2>
        <button value="cancel" class="icon-btn" aria-label="Chiudi">×</button>
      </div>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
